<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>كتاب دليل أحكام التجويد</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="format-detection" content="telephone=no">

    <meta
        name="description"
        content="النسخة الإلكترونية">

    <!-- بيانات معاينة الرابط -->

    <meta
        property="og:title"
        content="كتاب دليل أحكام التجويد">

    <meta
        property="og:description"
        content="النسخة الإلكترونية">

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:url"
        content="https://altajwid.github.io/">

    <meta
        property="og:image"
        content="https://altajwid.github.io/cover.jpg">

    <meta
        property="og:image:url"
        content="https://altajwid.github.io/cover.jpg">

    <meta
        property="og:image:secure_url"
        content="https://altajwid.github.io/cover.jpg">

    <meta
        property="og:image:type"
        content="image/jpeg">

    <meta
        property="og:image:width"
        content="984">

    <meta
        property="og:image:height"
        content="1452">

    <meta
        property="og:image:alt"
        content="غلاف كتاب دليل أحكام التجويد">

    <meta
        property="og:locale"
        content="ar_AR">

    <!-- بيانات منصة X -->

    <meta
        name="twitter:card"
        content="summary_large_image">

    <meta
        name="twitter:title"
        content="كتاب دليل أحكام التجويد">

    <meta
        name="twitter:description"
        content="النسخة الإلكترونية من كتاب دليل أحكام التجويد">

    <meta
        name="twitter:image"
        content="https://altajwid.github.io/cover.jpg">

    <!-- بيانات منظمة -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Book",
        "name": "كتاب دليل أحكام التجويد",
        "url": "https://altajwid.github.io/",
        "image": "https://altajwid.github.io/cover.jpg",
        "description": "النسخة الإلكترونية من كتاب دليل أحكام التجويد"
    }
    </script>


    <style>

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                "Cairo",
                "Tahoma",
                Arial,
                sans-serif;

            color: #26362d;

            background:
                linear-gradient(
                    145deg,
                    #07391f 0%,
                    #0b5c31 38%,
                    #dce9df 100%
                );

            min-height: 100vh;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }


        /* الحاوية الرئيسية */

        .page-wrapper {
            width: 100%;
            padding: 30px 14px 42px;
        }

        .container {
            width: 100%;
            max-width: 760px;

            margin: 0 auto;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.98),
                    rgba(250,250,247,0.97)
                );

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 18px 45px rgba(0,0,0,0.25),
                0 0 0 1px rgba(212,175,55,0.18);
        }


        /* الخط الذهبي العلوي */

        .container::before {
            content: "";

            display: block;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #78511e,
                    #d4af37,
                    #f3dc84,
                    #d4af37,
                    #78511e
                );
        }


        /* رأس الصفحة */

        .hero {
            padding: 28px 24px 18px;

            text-align: center;
        }

        h1 {
            margin: 0;

            font-family:
                "Amiri",
                "Traditional Arabic",
                serif;

            font-size: 30px;

            line-height: 1.5;

            font-weight: 900;

            color: #0b4d27;
        }

        .separator {
            width: 100px;
            height: 2px;

            margin: 15px auto 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d4af37,
                    transparent
                );
        }


        /* غلاف الكتاب */

        .cover-area {
            padding: 8px 26px 22px;

            text-align: center;
        }

        .cover-frame {
            display: inline-block;

            width: 82%;
            max-width: 520px;

            padding: 7px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #d4af37,
                    #7c522c,
                    #ead480
                );

            box-shadow:
                0 12px 28px rgba(0,0,0,0.22);
        }

        .cover {
            display: block;

            width: 100%;
            height: auto;

            border-radius: 12px;

            background: #ffffff;
        }


        /* التعريف المختصر */

        .intro-card {
            width: calc(100% - 48px);

            margin: 4px auto 24px;

            padding: 18px 20px;

            background:
                linear-gradient(
                    135deg,
                    #f6f3e8,
                    #fffdf8
                );

            border: 1px solid #e7d7a2;

            border-radius: 16px;

            line-height: 1.9;

            color: #405247;

            font-size: 16px;

            text-align: center;
        }

        .intro-card strong {
            color: #0b4d27;
        }


        /* زر تحميل الكتاب */

        .download-area {
            display: flex;

            justify-content: center;

            padding: 0 20px 28px;
        }

        .download-main-btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width: 88%;

            max-width: 390px;

            min-height: 62px;

            padding: 14px 24px;

            border-radius: 16px;

            border: 2px solid #d6b24a;

            text-decoration: none;

            color: #ffffff;

            font-size: 20px;

            font-weight: 900;

            line-height: 1.35;

            background:
                linear-gradient(
                    135deg,
                    #4e321b 0%,
                    #704824 48%,
                    #8a6033 100%
                );

            box-shadow:
                0 8px 20px rgba(77,50,27,0.34),
                inset 0 1px 0 rgba(255,255,255,0.18);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .download-main-btn:hover {
            transform: translateY(-3px);

            filter: brightness(1.08);

            box-shadow:
                0 12px 26px rgba(77,50,27,0.40),
                inset 0 1px 0 rgba(255,255,255,0.20);
        }

        .download-main-btn:active {
            transform: translateY(0);
        }

        .download-icon {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 38px;
            height: 38px;

            flex-shrink: 0;

            border-radius: 10px;

            background: rgba(255,255,255,0.14);

            font-size: 21px;
        }


        /* السماح بالنشر */

        .permission {
            width: calc(100% - 48px);

            margin: 0 auto 28px;

            padding: 13px 16px;

            border-radius: 12px;

            border: 1px solid #ead78d;

            background: #fff8da;

            color: #806414;

            text-align: center;

            font-size: 15px;

            font-weight: 800;

            line-height: 1.6;
        }


        /* المشاركة */

        .share-area {
            padding: 24px 18px 29px;

            background:
                linear-gradient(
                    180deg,
                    #f7faf7,
                    #eef5ef
                );

            border-top: 1px solid #dde8df;
        }

        .share-title {
            margin-bottom: 17px;

            text-align: center;

            font-size: 18px;

            font-weight: 900;

            color: #9d2442;
        }

        .share-buttons {
            display: flex;

            justify-content: center;

            align-items: flex-start;

            gap: 16px;

            flex-wrap: wrap;
        }

        .share-item {
            min-width: 62px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 7px;
        }

        .share-btn {
            width: 52px;
            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            text-decoration: none;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.17);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .share-btn:hover {
            transform:
                translateY(-3px)
                scale(1.05);

            filter: brightness(1.06);

            box-shadow:
                0 8px 18px rgba(0,0,0,0.22);
        }

        .share-icon {
            width: 24px;
            height: 24px;

            filter:
                brightness(0)
                invert(1);
        }

        .share-label {
            font-size: 12px;

            font-weight: 800;

            color: #3f4e44;
        }

        .whatsapp {
            background: #25D366;
        }

        .telegram {
            background: #0088cc;
        }

        .facebook {
            background: #1877F2;
        }

        .instagram {
            background:
                linear-gradient(
                    135deg,
                    #833ab4,
                    #fd1d1d,
                    #fcb045
                );
        }

        .x-platform {
            background: #000000;
        }


        /* التذييل */

        .footer {
            padding: 17px 20px 19px;

            text-align: center;

            background: #0c4226;
        }

        .ayah-footer {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;
        }

        .ayah-line {
            width: 42px;
            height: 1px;

            flex-shrink: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d4af37,
                    transparent
                );
        }

        .ayah-text {
            color: #ffffff;

            font-family:
                "Amiri",
                "Traditional Arabic",
                serif;

            font-size: 16px;

            font-weight: 700;

            line-height: 1.8;
        }


        /* زر العودة إلى الأعلى */

        #backToTop {
            position: fixed;

            bottom: 22px;
            left: 22px;

            width: 48px;
            height: 48px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 50%;

            background: #0b4d27;

            color: #ffffff;

            font-size: 21px;

            cursor: pointer;

            box-shadow:
                0 6px 16px rgba(0,0,0,0.26);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease,
                transform 0.25s ease;

            z-index: 999;
        }

        #backToTop.show {
            opacity: 1;

            visibility: visible;
        }

        #backToTop:hover {
            transform: translateY(-3px);
        }


        /* الهواتف */

        @media (max-width: 600px) {

            .page-wrapper {
                padding: 12px 10px 28px;
            }

            .container {
                border-radius: 18px;
            }

            .hero {
                padding: 22px 14px 14px;
            }

            h1 {
                font-size: 24px;
            }

            .cover-area {
                padding: 8px 16px 20px;
            }

            .cover-frame {
                width: 94%;

                padding: 5px;
            }

            .intro-card {
                width: calc(100% - 30px);

                padding: 15px 14px;

                font-size: 15px;
            }

            .download-area {
                padding: 0 14px 24px;
            }

            .download-main-btn {
                width: 96%;

                min-height: 58px;

                font-size: 18px;
            }

            .permission {
                width: calc(100% - 30px);

                font-size: 14px;
            }

            .share-area {
                padding-left: 10px;
                padding-right: 10px;
            }

            .share-buttons {
                gap: 11px;
            }

            .share-item {
                min-width: 55px;
            }

            .share-btn {
                width: 48px;
                height: 48px;
            }

            .ayah-footer {
                gap: 8px;
            }

            .ayah-line {
                width: 28px;
            }

            .ayah-text {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>

<div class="page-wrapper">

    <main class="container">


        <!-- عنوان الكتاب -->

        <section class="hero">

            <h1>
                كتاب دليل أحكام التجويد
            </h1>

            <div class="separator"></div>

        </section>


        <!-- غلاف الكتاب -->

        <section class="cover-area">

            <div class="cover-frame">

                <img
                    src="cover.jpg"
                    class="cover"
                    alt="غلاف كتاب دليل أحكام التجويد">

            </div>

        </section>


        <!-- تعريف الكتاب -->

        <div class="intro-card">

            كتابٌ تعليميٌّ في
            <strong>أحكام التجويد</strong>
            يهدف إلى تيسير تعلّم قواعد التلاوة
            وإتقان قراءة كتاب الله.

        </div>


        <!-- تحميل الكتاب -->

        <div class="download-area">

            <a
                href="dalil-altajwid.pdf"
                download
                class="download-main-btn"
                aria-label="تحميل كتاب دليل أحكام التجويد بصيغة PDF">

                <span
                    class="download-icon"
                    aria-hidden="true">
                    ⬇️
                </span>

                <span>
                    تحميل الكتاب PDF
                </span>

            </a>

        </div>


        <!-- السماح بالنشر -->

        <div class="permission">
            📌 يُسمح بالنسخ والمشاركة والنشر دون قيود.
        </div>


        <!-- المشاركة -->

        <section class="share-area">

            <div class="share-title">
                شارك الكتاب مع الأحبّة
            </div>


            <div class="share-buttons">


                <!-- واتساب -->

                <div class="share-item">

                    <a
                        class="share-btn whatsapp"
                        href="https://wa.me/?text=https%3A%2F%2Faltajwid.github.io%2F"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="مشاركة الكتاب عبر واتساب">

                        <img
                            src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg"
                            class="share-icon"
                            alt="واتساب">

                    </a>

                    <div class="share-label">
                        واتساب
                    </div>

                </div>


                <!-- تليغرام -->

                <div class="share-item">

                    <a
                        class="share-btn telegram"
                        href="https://t.me/share/url?url=https://altajwid.github.io/&text=كتاب%20دليل%20أحكام%20التجويد"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="مشاركة الكتاب عبر تليغرام">

                        <img
                            src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg"
                            class="share-icon"
                            alt="تليغرام">

                    </a>

                    <div class="share-label">
                        تليغرام
                    </div>

                </div>


                <!-- فيسبوك -->

                <div class="share-item">

                    <a
                        class="share-btn facebook"
                        href="https://www.facebook.com/sharer/sharer.php?u=https://altajwid.github.io/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="مشاركة الكتاب عبر فيسبوك">

                        <img
                            src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg"
                            class="share-icon"
                            alt="فيسبوك">

                    </a>

                    <div class="share-label">
                        فيسبوك
                    </div>

                </div>


                <!-- إنستغرام -->

                <div class="share-item">

                    <a
                        class="share-btn instagram"
                        href="https://www.instagram.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="فتح إنستغرام">

                        <img
                            src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
                            class="share-icon"
                            alt="إنستغرام">

                    </a>

                    <div class="share-label">
                        إنستغرام
                    </div>

                </div>


                <!-- منصة X -->

                <div class="share-item">

                    <a
                        class="share-btn x-platform"
                        href="https://x.com/intent/post?url=https://altajwid.github.io/&text=كتاب%20دليل%20أحكام%20التجويد"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="مشاركة الكتاب عبر منصة X">

                        <img
                            src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg"
                            class="share-icon"
                            alt="منصة X">

                    </a>

                    <div class="share-label">
                        منصة X
                    </div>

                </div>


            </div>

        </section>


        <!-- التذييل -->

        <footer class="footer">

            <div class="ayah-footer">

                <span class="ayah-line"></span>

                <span class="ayah-text">
                    ﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾
                </span>

                <span class="ayah-line"></span>

            </div>

        </footer>


    </main>

</div>


<!-- زر العودة إلى الأعلى -->

<div
    id="backToTop"
    aria-label="العودة إلى أعلى الصفحة">
    ↑
</div>


<script>

    const backToTop =
        document.getElementById("backToTop");

    window.addEventListener("scroll", () => {

        if (window.scrollY > 280) {

            backToTop.classList.add("show");

        } else {

            backToTop.classList.remove("show");

        }

    });


    backToTop.addEventListener("click", () => {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    });

</script>


</body>

</html>
